# 1) Web services
services:
  - type: web
    name: backend
    env: docker
    # replace with your GitHub repo URL (Render will auto‑detect if you push this file)
    repo: https://github.com/USER/REPO  
    branch: main
    autoDeploy: true
    plan: starter
    dockerContext: backend
    dockerfilePath: backend/docker/Dockerfile.prod
    healthCheckPath: /graphql               # GraphQL endpoint
    envVars:
      - key: PORT
        value: "8000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: db
      - key: REDIS_URL
        fromRedis:
          name: cache
      # Secrets (add values in the Render dashboard or via Env Groups)
      - key: SESSION_SECRET
      - key: COOKIES_SECRET
      - key: MAIL_SENDGRID_API_KEY
      - key: CLOUDINARY_URL
      - key: TELEGRAM_BOT_TOKEN
      - key: STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET

  - type: web
    name: frontend
    env: docker
    repo: https://github.com/MaridiM/medic-hub
    branch: app
    autoDeploy: true
    plan: starter
    dockerContext: frontend
    dockerfilePath: frontend/docker/Dockerfile.prod
    healthCheckPath: /                        # serve guard
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://your-domain.com        # adjust to your domain or Env Group
      # any other frontend‑only secrets here

# 2) Managed Postgres
databases:
  - name: postgres
    engine: POSTGRES
    plan: starter
    region: oregon

# 3) Managed Redis
redis:
  - name: cache
    plan: starter
    region: oregon
